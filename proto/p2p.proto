syntax = "proto3";

package p2p;

option go_package = "github.com/IEEECS-VIT/p2p-model-distribution/internal/protocol";

enum MessageType {
    MSG_UNKNOWN = 0;
    MSG_HANDSHAKE_REQUEST = 1;
    MSG_HANDSHAKE_RESPONSE = 2;
    MSG_GET_METADATA_REQUEST = 3;
    MSG_GET_METADATA_RESPONSE = 4;
    MSG_GET_CHUNK_REQUEST = 5;
    MSG_GET_CHUNK_RESPONSE = 6;
    // DHT RPCs: requests carry a DHTRequest, responses a DHTResponse.
    MSG_DHT_PING = 7;
    MSG_DHT_PONG = 8;
    MSG_DHT_FIND_NODE = 9;
    MSG_DHT_FIND_NODE_RESPONSE = 10;
    MSG_DHT_FIND_VALUE = 11;
    MSG_DHT_FIND_VALUE_RESPONSE = 12;
    MSG_DHT_ADD_PROVIDER = 13;
    MSG_DHT_ADD_PROVIDER_RESPONSE = 14;
    MSG_ERROR = 15;             // generic error response to any request
}

message Envelope {
    string id = 1;          // Unique ID generated by the requestor to pair with a response
    MessageType type = 2;   // Type of message contained in the payload
    bytes payload = 3;      // The serialized inner message payload
    bool is_response = 4;   // true for responses; responses are never routed to handlers
}

// ErrorResponse is sent (with type MSG_ERROR) when a request cannot be
// handled, so the requester fails fast instead of waiting for a timeout.
message ErrorResponse {
    string error = 1;
}

message HandshakeRequest {
    string peer_id = 1;
    string version = 2;
}

message HandshakeResponse {
    string peer_id = 1;
    bool success = 2;
    string error = 3;
}

message GetMetadataRequest {
    string file_id = 1;     // This can be the file manifest's CID
}

message GetMetadataResponse {
    string file_id = 1;
    bool success = 2;
    bytes metadata_json = 3; // The JSON string bytes representing FileMeta
    string error = 4;
}

message GetChunkRequest {
    string file_id = 1;     // The file manifest's CID
    int32 chunk_index = 2;
}

message GetChunkResponse {
    string file_id = 1;
    int32 chunk_index = 2;
    bool success = 3;
    bytes data = 4;
    string error = 5;
}

// DHTPeer is a node and the address it can be dialed at. The ID is only a
// claim until a connection to the address authenticates it via TLS.
message DHTPeer {
    string id = 1;
    string ip = 2;
    uint32 port = 3;
}

// DHTRequest is the payload of every DHT request. The sender's node ID is
// never carried in the message: it is the TLS-authenticated peer ID.
message DHTRequest {
    uint32 listen_port = 1; // sender's listen port; 0 if it accepts no connections
    string key = 2;         // FIND_NODE target, FIND_VALUE / ADD_PROVIDER key
}

// DHTResponse is the payload of every DHT response.
message DHTResponse {
    uint32 listen_port = 1;
    repeated DHTPeer closer_peers = 2; // FIND_NODE / FIND_VALUE
    repeated DHTPeer providers = 3;    // FIND_VALUE
}
